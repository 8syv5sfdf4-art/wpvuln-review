[package]
name = "wordpress-vulnerable-scanner"
version = "1.0.0"
authors = ["Robert F. Ecker <robert@robdotec.com>"]
edition = "2024"
rust-version = "1.91.1"
description = "WordPress vulnerability scanner - detects known CVEs in core, plugins, and themes"
documentation = "https://docs.rs/wordpress-vulnerable-scanner"
repository = "https://github.com/robdotec/wordpress-vulnerable-scanner"
license = "MIT"
keywords = ["wordpress", "security", "vulnerability", "cve", "scanner"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
# CLI argument parsing
clap = { version = "4.5", features = ["derive", "color", "env"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
futures = "0.3"

# HTML parsing
scraper = "0.22"

# URL handling
url = "2.5"
urlencoding = "2.1"

# Serialization/deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2"

# Table output
comfy-table = "7"

# Regex for version extraction
regex = "1"

# Version comparison
semver = "1"

# Archives, read in place by `inventory`
tar = "0.4.46"
flate2 = "1.1.10"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"

[package.metadata.docs.rs]
all-features = true
